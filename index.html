<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>월급 운영 가계부</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f7f9;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.app{max-width:720px;margin:auto;padding:22px 18px 100px}
h1{font-size:28px;margin:8px 0 4px}.sub{color:#777;margin-bottom:20px}
.monthbar{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 2px 10px #0000000a}
.monthbar button{border:0;background:#f0f1f5;border-radius:12px;width:42px;height:38px;font-size:20px}
.month{font-size:19px;font-weight:800}
.summary{margin-top:16px;background:#fff;border-radius:22px;padding:20px;box-shadow:0 2px 12px #0000000a}
.summary-title{font-weight:800;font-size:18px;margin-bottom:15px}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#f6f7fa;border-radius:16px;padding:14px}
.label{font-size:13px;color:#777}.value{font-size:20px;font-weight:800;margin-top:5px}
.value.in{color:#198754}.value.out{color:#d9485f}
.chartbox{display:flex;gap:20px;align-items:center;margin-top:20px}
.donut{width:150px;height:150px;border-radius:50%;background:conic-gradient(#6c8cff 0 25%,#72c6a5 25% 45%,#f2b35d 45% 65%,#e887a5 65% 100%);position:relative;flex:none}
.donut:after{content:"";position:absolute;inset:34px;background:#fff;border-radius:50%}
.legend{display:grid;gap:9px;flex:1}.legend div{display:flex;justify-content:space-between;font-size:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.section{margin-top:18px;background:#fff;border-radius:22px;padding:18px;box-shadow:0 2px 12px #0000000a}
.section h2{font-size:17px;margin:0 0 14px}
.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee}.row:last-child{border:0}
.fab{position:fixed;right:22px;bottom:24px;width:62px;height:62px;border:0;border-radius:50%;background:#111;color:#fff;font-size:30px;box-shadow:0 8px 25px #0004}
.modal{display:none;position:fixed;inset:0;background:#0006;align-items:flex-end;z-index:5}
.sheet{background:#fff;border-radius:26px 26px 0 0;padding:22px 18px 30px;width:100%;max-width:720px;margin:auto}
.sheet h2{margin:0 0 18px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice button,.save{padding:17px;border:0;border-radius:16px;font-size:17px;font-weight:800}
.withdraw{background:#ffecef;color:#c92a45}.deposit{background:#eaf8ef;color:#18794e}
.form{display:none;margin-top:18px}.form label{display:block;font-size:13px;color:#777;margin:12px 0 6px}
input,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:14px;background:#fff;font-size:16px}
.save{width:100%;margin-top:16px;background:#111;color:#fff}
.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px}
.note{font-size:13px;color:#777;line-height:1.5}
.credit{background:#f4f0ff;border-radius:16px;padding:14px;margin-top:12px}
</style>
</head>
<body>
<div class="app">
  <h1>가계부</h1>
  <div class="sub" id="periodText">월급 운영 현황</div>

  <div class="monthbar">
    <button onclick="changeMonth(-1)">‹</button>
    <div class="month" id="monthTitle"></div>
    <button onclick="changeMonth(1)">›</button>
  </div>

  <div class="summary">
    <div class="summary-title" id="summaryTitle"></div>
    <div class="nums">
      <div class="card"><div class="label">입금</div><div class="value in" id="income">0원</div></div>
      <div class="card"><div class="label">전체 지출</div><div class="value out" id="expense">0원</div></div>
      <div class="card"><div class="label">저금</div><div class="value" id="saving">0원</div></div>
      <div class="card"><div class="label">운영 후 남은 돈</div><div class="value" id="remain">0원</div></div>
    </div>

    <div class="chartbox">
      <div class="donut" id="donut"></div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <div class="section">
    <h2>이번 달 카테고리별 운영</h2>
    <div id="categories"></div>
  </div>

  <div class="section">
    <h2>신용카드 대금</h2>
    <div id="creditSummary"></div>
    <div class="note">카드대금은 이번 달 현금 지출로 한 번 더 더하지 않고, 지난달 카드 사용액을 이번 달 입금에서 차감합니다. 단, 카드 사용 내역은 생활비·송금·저금 등 원래 카테고리 합계에 포함됩니다.</div>
  </div>

  <div class="section">
    <h2>최근 월별 흐름</h2>
    <div id="history"></div>
  </div>
</div>

<button class="fab" onclick="openModal()">＋</button>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
 <div class="sheet">
   <button class="close" onclick="closeModal()">×</button>
   <h2>무엇을 기록할까요?</h2>
   <div class="choice">
     <button class="withdraw" onclick="showForm('출금')">출금</button>
     <button class="deposit" onclick="showForm('입금')">입금</button>
   </div>

   <div class="form" id="form">
    <label>월</label>
    <input type="month" id="fMonth">
    <label>금액</label>
    <input type="number" id="fAmount" placeholder="예: 300000">
    <label>큰 카테고리</label>
    <select id="fCategory">
      <option>생활비</option><option>저금</option><option>모임통장</option><option>송금</option><option>기타</option>
    </select>
    <label>세부 이름</label>
    <input id="fName" placeholder="예: 청년미래적금, 엄마, 식비">
    <label id="cardLabel">신용카드로 사용했나요?</label>
    <select id="fCard"><option value="no">아니요</option><option value="yes">예</option></select>
    <div class="credit" id="cardHelp" style="display:none">신용카드 사용액도 선택한 카테고리의 합계에 포함됩니다. 카드대금은 다음 달에 별도로 차감됩니다.</div>
    <button class="save" onclick="saveEntry()">저장</button>
   </div>
 </div>
</div>

<script>
const KEY="my_budget_v4";
let entries=JSON.parse(localStorage.getItem(KEY)||"[]");
let current=new Date();
let formType="출금";

const money=n=>new Intl.NumberFormat("ko-KR").format(Math.round(n))+"원";
const ym=d=>d.toISOString().slice(0,7);
const monthLabel=m=>{let [y,mo]=m.split("-");return `${y}년 ${Number(mo)}월`};

function render(){
 const m=ym(current), list=entries.filter(e=>e.month===m);
 document.getElementById("monthTitle").textContent=monthLabel(m);
 document.getElementById("summaryTitle").textContent=`${Number(m.slice(5))}월 월급 운영 현황`;

 const income=list.filter(e=>e.type==="입금").reduce((a,e)=>a+e.amount,0);
 const cashOut=list.filter(e=>e.type==="출금" && !e.card).reduce((a,e)=>a+e.amount,0);
 const saving=list.filter(e=>e.type==="출금" && e.category==="저금").reduce((a,e)=>a+e.amount,0);

 // 이번 달 입금에서 이번 달에 납부한 "지난달 카드 사용액"을 차감
 const prev=new Date(current); prev.setMonth(prev.getMonth()-1);
 const pm=ym(prev);
 const prevCard=entries.filter(e=>e.month===pm && e.type==="출금" && e.card).reduce((a,e)=>a+e.amount,0);
 const totalOut=cashOut+prevCard;
 document.getElementById("income").textContent=money(income);
 document.getElementById("expense").textContent=money(totalOut);
 document.getElementById("saving").textContent=money(saving);
 document.getElementById("remain").textContent=money(income-totalOut);

 const cats=["생활비","저금","모임통장","송금","기타"];
 const vals=cats.map(c=>list.filter(e=>e.type==="출금"&&e.category===c).reduce((a,e)=>a+e.amount,0));
 const sum=vals.reduce((a,b)=>a+b,0)||1;
 let acc=0, stops=[];
 vals.forEach((v,i)=>{let p=v/sum*100;stops.push(`${["#6c8cff","#72c6a5","#f2b35d","#e887a5","#aaa"][i]} ${acc}% ${acc+p}%`);acc+=p});
 document.getElementById("donut").style.background=`conic-gradient(${stops.join(",")})`;
 document.getElementById("legend").innerHTML=cats.map((c,i)=>`<div><span><span class="dot" style="background:${["#6c8cff","#72c6a5","#f2b35d","#e887a5","#aaa"][i]}"></span>${c}</span><b>${Math.round(vals[i]/sum*100)}%</b></div>`).join("");

 document.getElementById("categories").innerHTML=cats.map((c,i)=>{
   const normal=list.filter(e=>e.type==="출금"&&e.category===c).reduce((a,e)=>a+e.amount,0);
   const card=list.filter(e=>e.type==="출금"&&e.category===c&&e.card).reduce((a,e)=>a+e.amount,0);
   return `<div class="row"><span>${c}${card?` <small style="color:#7b61c9">· 카드 ${money(card)}</small>`:""}</span><b>${money(normal)}</b></div>`
 }).join("");

 document.getElementById("creditSummary").innerHTML=`<div class="row"><span>지난달 카드 사용액 → 이번 달 차감</span><b>${money(prevCard)}</b></div>`;

 let hist=[];
 for(let i=0;i<6;i++){
   let d=new Date(current);d.setMonth(d.getMonth()-i);let mm=ym(d), a=entries.filter(e=>e.month===mm);
   let inc=a.filter(e=>e.type==="입금").reduce((s,e)=>s+e.amount,0);
   let out=a.filter(e=>e.type==="출금"&&!e.card).reduce((s,e)=>s+e.amount,0);
   let sav=a.filter(e=>e.type==="출금"&&e.category==="저금").reduce((s,e)=>s+e.amount,0);
   hist.push(`<div class="row"><span>${monthLabel(mm)}</span><span>입금 ${money(inc)} · 지출 ${money(out)} · 저금 ${money(sav)}</span></div>`);
 }
 document.getElementById("history").innerHTML=hist.join("");
}
function changeMonth(n){current.setMonth(current.getMonth()+n);render()}
function openModal(){document.getElementById("modal").style.display="flex";document.getElementById("fMonth").value=ym(current)}
function closeModal(){document.getElementById("modal").style.display="none";document.getElementById("form").style.display="none"}
function showForm(type){formType=type;document.getElementById("form").style.display="block";document.getElementById("cardLabel").style.display=type==="출금"?"block":"none";document.getElementById("fCard").style.display=type==="출금"?"block":"none";document.getElementById("fCard").value="no"}
document.getElementById("fCard").addEventListener("change",e=>document.getElementById("cardHelp").style.display=e.target.value==="yes"?"block":"none");
function saveEntry(){
 const amount=Number(document.getElementById("fAmount").value);
 if(!amount)return alert("금액을 입력해줘.");
 entries.push({id:Date.now(),month:document.getElementById("fMonth").value||ym(current),type:formType,amount,category:formType==="입금"?"입금":document.getElementById("fCategory").value,name:document.getElementById("fName").value,card:formType==="출금"&&document.getElementById("fCard").value==="yes"});
 localStorage.setItem(KEY,JSON.stringify(entries));closeModal();render();
}
render();
</script>
</body>
</html>
