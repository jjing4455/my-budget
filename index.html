<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>월급 운영 가계부</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f7f9;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.app{max-width:720px;margin:auto;padding:22px 18px 110px}
h1{font-size:28px;margin:8px 0 4px}.sub{color:#777;margin-bottom:18px}
.monthbar{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 2px 10px #0000000a}
.monthbar button{border:0;background:#f0f1f5;border-radius:12px;width:42px;height:38px;font-size:20px}
.month{font-size:19px;font-weight:800}
.summary{margin-top:16px;background:#fff;border-radius:22px;padding:20px;box-shadow:0 2px 12px #0000000a}
.summary-title{font-weight:800;font-size:18px;margin-bottom:15px}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#f6f7fa;border-radius:16px;padding:14px}
.label{font-size:13px;color:#777}.value{font-size:20px;font-weight:800;margin-top:5px}
.value.in{color:#198754}.value.out{color:#d9485f}
.chartbox{display:flex;gap:20px;align-items:center;margin-top:20px}
.donut{width:150px;height:150px;border-radius:50%;background:#ececf0;position:relative;flex:none}
.donut:after{content:"";position:absolute;inset:34px;background:#fff;border-radius:50%}
.legend{display:grid;gap:9px;flex:1}.legend div{display:flex;justify-content:space-between;font-size:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.section{margin-top:18px;background:#fff;border-radius:22px;padding:18px;box-shadow:0 2px 12px #0000000a}
.section h2{font-size:17px;margin:0 0 14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #eee;align-items:center}.row:last-child{border:0}
.row-main{min-width:0}.row-main strong{display:block}.row-main small{color:#888}
.row-actions{display:flex;gap:6px;flex:none}.mini{border:0;background:#eef0f4;border-radius:9px;padding:7px 9px;font-size:12px}
.fab{position:fixed;right:22px;bottom:24px;width:62px;height:62px;border:0;border-radius:50%;background:#111;color:#fff;font-size:30px;box-shadow:0 8px 25px #0004;z-index:4}
.modal{display:none;position:fixed;inset:0;background:#0006;align-items:flex-end;z-index:5}
.sheet{background:#fff;border-radius:26px 26px 0 0;padding:22px 18px 30px;width:100%;max-width:720px;margin:auto;max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 18px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice button,.save{padding:17px;border:0;border-radius:16px;font-size:17px;font-weight:800}
.withdraw{background:#ffecef;color:#c92a45}.deposit{background:#eaf8ef;color:#18794e}
.form{display:none;margin-top:18px}.form label{display:block;font-size:13px;color:#777;margin:12px 0 6px}
input,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:14px;background:#fff;font-size:16px}
.amount-wrap{position:relative}.amount-wrap input{padding-right:42px;font-size:21px;font-weight:800}
.amount-unit{position:absolute;right:15px;top:14px;font-weight:700;color:#777}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.quick button{border:0;background:#f0f1f5;border-radius:11px;padding:10px;font-weight:700}
.save{width:100%;margin-top:16px;background:#111;color:#fff}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px}
.note{font-size:13px;color:#777;line-height:1.5}
.credit{background:#f4f0ff;border-radius:16px;padding:14px;margin-top:12px}
.segment{display:grid;grid-template-columns:1fr 1fr;background:#f0f1f5;border-radius:14px;padding:4px;gap:4px}
.segment button{border:0;background:transparent;border-radius:11px;padding:11px;font-weight:800;color:#777}.segment button.active{background:#fff;color:#2774d9;box-shadow:0 1px 4px #0001}
.manage{margin-top:8px;border:0;background:#eef3ff;color:#2463c4;border-radius:10px;padding:8px 10px;font-weight:700}
.empty{color:#999;text-align:center;padding:18px 0}
.modal.small .sheet{max-height:70vh}
hr{border:0;border-top:1px solid #eee;margin:16px 0}
</style>
</head>
<body>
<div class="app">
  <h1>가계부</h1>
  <div class="sub">월급 운영 현황</div>

  <div class="monthbar">
    <button onclick="changeMonth(-1)">‹</button>
    <div class="month" id="monthTitle"></div>
    <button onclick="changeMonth(1)">›</button>
  </div>

  <div class="summary">
    <div class="summary-title" id="summaryTitle"></div>
    <div class="nums">
      <div class="card"><div class="label">입금</div><div class="value in" id="income">0원</div></div>
      <div class="card"><div class="label">이번 달 실제 지출</div><div class="value out" id="expense">0원</div></div>
      <div class="card"><div class="label">저금</div><div class="value" id="saving">0원</div></div>
      <div class="card"><div class="label">운영 후 남은 돈</div><div class="value" id="remain">0원</div></div>
    </div>
    <div class="chartbox">
      <div class="donut" id="donut"></div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <div class="section">
    <h2>이번 달 카테고리별 운영</h2>
    <div id="categories"></div>
  </div>

  <div class="section">
    <h2>신용카드</h2>
    <div id="creditSummary"></div>
    <div class="note">신용카드 사용은 사용한 달의 생활비·저금·송금 등의 카테고리에 포함됩니다. 실제 카드대금은 다음 달 월급 운영에서 빠집니다. 예: 7월 카드 사용액 → 8월 월급에서 차감.</div>
  </div>

  <div class="section">
    <h2>이 달의 기록</h2>
    <div id="records"></div>
  </div>

  <div class="section">
    <h2>월별 흐름</h2>
    <div id="history"></div>
  </div>
</div>

<button class="fab" onclick="openModal()">＋</button>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
 <div class="sheet">
   <button class="close" onclick="closeModal()">×</button>
   <h2 id="modalTitle">무엇을 기록할까요?</h2>
   <div class="choice" id="typeChoice">
     <button class="withdraw" onclick="showForm('출금')">출금</button>
     <button class="deposit" onclick="showForm('입금')">입금</button>
   </div>

   <div class="form" id="form">
    <label>기록할 월</label>
    <input type="month" id="fMonth">
    <label>금액</label>
    <div class="amount-wrap">
      <input type="tel" inputmode="numeric" id="fAmount" placeholder="0" autocomplete="off">
      <span class="amount-unit">원</span>
    </div>
    <div class="quick">
      <button onclick="addQuick(1000)">+1,000</button>
      <button onclick="addQuick(10000)">+10,000</button>
      <button onclick="addQuick(100000)">+100,000</button>
    </div>

    <label>카테고리</label>
    <select id="fCategory"></select>
    <button class="manage" id="manageBtn" onclick="manageCategories()">출금 카테고리 관리</button>

    <label>세부 이름</label>
    <input id="fName" placeholder="예: 청년미래적금, 엄마, 식비">

    <div id="paymentBox">
      <label>결제수단</label>
      <div class="segment">
        <button id="cashBtn" class="active" onclick="setPayment(false)">현금/계좌</button>
        <button id="cardBtn" onclick="setPayment(true)">신용카드</button>
      </div>
      <div class="credit" id="cardHelp" style="display:none">
        이 금액은 <b>사용한 달의 지출</b>에 포함되지만, 실제 카드대금은 <b>다음 달</b>에 빠집니다.
      </div>
    </div>

    <button class="save" onclick="saveEntry()">저장</button>
   </div>
 </div>
</div>

<script>
const KEY="my_budget_v5";
const CAT_KEY="my_budget_categories_v5";
const defaultOutCats=["생활비","저금","모임통장","송금","기타"];
const depositCats=["월급","소득","송금","기타"];
let entries=JSON.parse(localStorage.getItem(KEY)||"[]");
let outCats=JSON.parse(localStorage.getItem(CAT_KEY)||JSON.stringify(defaultOutCats));
let current=new Date(); current.setDate(1);
let formType="출금", editingId=null, isCard=false;

const colors=["#6c8cff","#72c6a5","#f2b35d","#e887a5","#9c86d8","#8eb6c9","#b0a59a","#d47d9a"];
const money=n=>new Intl.NumberFormat("ko-KR").format(Math.round(n))+"원";
const ym=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
const monthLabel=m=>{let [y,mo]=m.split("-");return `${y}년 ${Number(mo)}월`};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function formatAmountInput(){
 const el=document.getElementById("fAmount");
 let raw=el.value.replace(/[^0-9]/g,"");
 el.value=raw?Number(raw).toLocaleString("ko-KR"):"";
}
document.getElementById("fAmount").addEventListener("input",formatAmountInput);

function render(){
 const m=ym(current), list=entries.filter(e=>e.month===m);
 document.getElementById("monthTitle").textContent=monthLabel(m);
 document.getElementById("summaryTitle").textContent=`${Number(m.slice(5))}월 월급 운영 현황`;

 const income=list.filter(e=>e.type==="입금").reduce((a,e)=>a+e.amount,0);
 const thisMonthCash=list.filter(e=>e.type==="출금"&&!e.card).reduce((a,e)=>a+e.amount,0);
 const saving=list.filter(e=>e.type==="출금"&&e.category==="저금").reduce((a,e)=>a+e.amount,0);

 const d=new Date(current); d.setMonth(d.getMonth()-1);
 const prev=ym(d);
 const prevCard=entries.filter(e=>e.month===prev&&e.type==="출금"&&e.card).reduce((a,e)=>a+e.amount,0);
 const actualExpense=thisMonthCash+prevCard;
 document.getElementById("income").textContent=money(income);
 document.getElementById("expense").textContent=money(actualExpense);
 document.getElementById("saving").textContent=money(saving);
 document.getElementById("remain").textContent=money(income-actualExpense);

 const cats=outCats;
 const vals=cats.map(c=>list.filter(e=>e.type==="출금"&&e.category===c).reduce((a,e)=>a+e.amount,0));
 const sum=vals.reduce((a,b)=>a+b,0);
 let acc=0,stops=[];
 vals.forEach((v,i)=>{let p=sum?v/sum*100:0;stops.push(`${colors[i%colors.length]} ${acc}% ${acc+p}%`);acc+=p});
 document.getElementById("donut").style.background=sum?`conic-gradient(${stops.join(",")})`:"#ececf0";
 document.getElementById("legend").innerHTML=sum?cats.map((c,i)=>`<div><span><span class="dot" style="background:${colors[i%colors.length]}"></span>${esc(c)}</span><b>${Math.round(vals[i]/sum*100)}%</b></div>`).join(""):`<div class="empty">아직 출금 기록이 없어요.</div>`;

 document.getElementById("categories").innerHTML=cats.length?cats.map((c,i)=>{
   const total=list.filter(e=>e.type==="출금"&&e.category===c).reduce((a,e)=>a+e.amount,0);
   const card=list.filter(e=>e.type==="출금"&&e.category===c&&e.card).reduce((a,e)=>a+e.amount,0);
   return `<div class="row"><span>${esc(c)}${card?` <small style="color:#7b61c9">· 카드 ${money(card)}</small>`:""}</span><b>${money(total)}</b></div>`
 }).join(""):`<div class="empty">카테고리를 추가해 주세요.</div>`;

 document.getElementById("creditSummary").innerHTML=`<div class="row"><span>${monthLabel(prev)} 사용 카드 → ${monthLabel(m)}에 결제</span><b>${money(prevCard)}</b></div>`;

 const monthList=[...list].sort((a,b)=>b.id-a.id);
 document.getElementById("records").innerHTML=monthList.length?monthList.map(e=>{
   const typeClass=e.type==="입금"?"in":"out";
   const method=e.type==="출금"?(e.card?"신용카드":"현금/계좌"):"";
   return `<div class="row">
     <div class="row-main">
       <strong>${e.type==="입금"?"+":"−"} ${money(e.amount)}</strong>
       <small>${esc(e.category)}${e.name?" · "+esc(e.name):""}${method?" · "+method:""}</small>
     </div>
     <div class="row-actions">
       <button class="mini" onclick="editEntry(${e.id})">수정</button>
       <button class="mini" onclick="deleteEntry(${e.id})">삭제</button>
     </div>
   </div>`;
 }).join(""):`<div class="empty">아직 이 달의 기록이 없어요.</div>`;

 let hist=[];
 for(let i=0;i<6;i++){
   let d2=new Date(current);d2.setMonth(d2.getMonth()-i);let mm=ym(d2),a=entries.filter(e=>e.month===mm);
   let inc=a.filter(e=>e.type==="입금").reduce((s,e)=>s+e.amount,0);
   let cash=a.filter(e=>e.type==="출금"&&!e.card).reduce((s,e)=>s+e.amount,0);
   let pc=new Date(d2);pc.setMonth(pc.getMonth()-1);let pcm=ym(pc);
   let pcv=entries.filter(e=>e.month===pcm&&e.type==="출금"&&e.card).reduce((s,e)=>s+e.amount,0);
   let out=cash+pcv;
   let sav=a.filter(e=>e.type==="출금"&&e.category==="저금").reduce((s,e)=>s+e.amount,0);
   hist.push(`<div class="row"><span>${monthLabel(mm)}</span><span>입금 ${money(inc)} · 지출 ${money(out)} · 저금 ${money(sav)}</span></div>`);
 }
 document.getElementById("history").innerHTML=hist.join("");
}

function changeMonth(n){current.setMonth(current.getMonth()+n);render()}
function openModal(){editingId=null;document.getElementById("modalTitle").textContent="무엇을 기록할까요?";document.getElementById("typeChoice").style.display="grid";document.getElementById("form").style.display="none";resetForm();document.getElementById("modal").style.display="flex"}
function closeModal(){document.getElementById("modal").style.display="none";document.getElementById("form").style.display="none";editingId=null}
function resetForm(){
 document.getElementById("fMonth").value=ym(current);
 document.getElementById("fAmount").value="";
 document.getElementById("fName").value="";
 isCard=false; updatePaymentUI();
}
function showForm(type){
 formType=type;
 document.getElementById("typeChoice").style.display="none";
 document.getElementById("form").style.display="block";
 document.getElementById("modalTitle").textContent=type+" 기록";
 document.getElementById("manageBtn").style.display=type==="출금"?"block":"none";
 document.getElementById("paymentBox").style.display=type==="출금"?"block":"none";
 populateCategories();
}
function populateCategories(){
 const sel=document.getElementById("fCategory");
 const cats=formType==="출금"?outCats:depositCats;
 sel.innerHTML=cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
}
function manageCategories(){
 let action=prompt("출금 카테고리 관리\n\n추가하려면: 추가:카테고리명\n삭제하려면: 삭제:카테고리명\n\n예) 추가:교통비");
 if(!action)return;
 const [cmd,...rest]=action.split(":"); const name=rest.join(":").trim();
 if(!name)return;
 if(cmd.trim()==="추가"){
   if(!outCats.includes(name))outCats.push(name);
 }else if(cmd.trim()==="삭제"){
   if(outCats.length<=1)return alert("카테고리는 최소 1개가 필요해요.");
   outCats=outCats.filter(c=>c!==name);
 }else return alert("형식이 맞지 않아요.");
 localStorage.setItem(CAT_KEY,JSON.stringify(outCats));populateCategories();render();
}
function setPayment(card){isCard=card;updatePaymentUI()}
function updatePaymentUI(){
 document.getElementById("cashBtn").classList.toggle("active",!isCard);
 document.getElementById("cardBtn").classList.toggle("active",isCard);
 document.getElementById("cardHelp").style.display=isCard?"block":"none";
}
function addQuick(v){
 const el=document.getElementById("fAmount");
 const raw=Number(el.value.replace(/[^0-9]/g,"")||0)+v;
 el.value=raw.toLocaleString("ko-KR");
}
function parseAmount(){return Number(document.getElementById("fAmount").value.replace(/[^0-9]/g,"")||0)}

function saveEntry(){
 const amount=parseAmount();
 const month=document.getElementById("fMonth").value||ym(current);
 const category=document.getElementById("fCategory").value;
 const name=document.getElementById("fName").value.trim();
 if(!amount)return alert("금액을 입력해 주세요.");
 if(!category)return alert("카테고리를 선택해 주세요.");

 const item={id:editingId||Date.now(),month,type:formType,amount,category,name,card:formType==="출금"&&isCard};
 if(editingId){entries=entries.map(e=>e.id===editingId?item:e)}else entries.push(item);
 localStorage.setItem(KEY,JSON.stringify(entries));
 closeModal();render();
}
function editEntry(id){
 const e=entries.find(x=>x.id===id); if(!e)return;
 editingId=id; formType=e.type; isCard=!!e.card;
 document.getElementById("modalTitle").textContent="기록 수정";
 document.getElementById("typeChoice").style.display="none";
 document.getElementById("form").style.display="block";
 document.getElementById("fMonth").value=e.month;
 document.getElementById("fAmount").value=e.amount.toLocaleString("ko-KR");
 document.getElementById("fName").value=e.name||"";
 document.getElementById("manageBtn").style.display=e.type==="출금"?"block":"none";
 document.getElementById("paymentBox").style.display=e.type==="출금"?"block":"none";
 populateCategories();
 document.getElementById("fCategory").value=e.category;
 updatePaymentUI();
 document.getElementById("modal").style.display="flex";
}
function deleteEntry(id){
 if(!confirm("이 기록을 삭제할까요?"))return;
 entries=entries.filter(e=>e.id!==id);
 localStorage.setItem(KEY,JSON.stringify(entries));render();
}
render();
</script>
</body>
</html>
